function webBind(){const n=$('#f_name'),z=$('#wi');if(!n||!z)return;n.oninput=()=>{clearTimeout(wT);const v=n.value.trim();if(v.length<3){z.innerHTML='';return}wT=setTimeout(async()=>{const col=colorsFor(v);const draw=(r,busy)=>{if(n.value.trim()!=v||!$('#wi'))return;if(!col&&!r&&!busy){z.innerHTML='<p class="m">Rien trouvé pour ce nom. Remplis à la main.</p>';return}
z.innerHTML='<div class="note">'+(col?'<p style="margin:0 0 6px"><b>Couleurs célèbres de ce modèle</b><br><span style="font-weight:400">'+esc(col)+'</span></p>':'')+(r?'<p style="margin:6px 0"><b>Année de sortie : '+esc(r.year||'non trouvée')+'</b></p><p style="margin:6px 0;font-weight:400">'+esc(r.desc)+'</p><p class="src">Source : Wikipédia'+(r.lang=='en'?' (texte en anglais)':'')+'. Vérifie avant d\'utiliser.</p>':(busy?'<p class="src">Recherche de l\'année et de la description sur le net…</p>':''))+'<p class="src">Les champs déjà remplis ne sont pas touchés.</p><button type="button" class="btn g" id="wok" style="margin-top:6px;width:100%">Utiliser</button><button type="button" class="btn alt" id="wno" style="margin-top:6px;width:100%">Ignorer</button></div>';
$('#wno').onclick=()=>{z.innerHTML=''};$('#wok').onclick=()=>{if(col&&!$('#f_colors').value.trim())$('#f_colors').value=col;if(r&&r.year&&!$('#f_year').value.trim())$('#f_year').value=r.year;if(r&&r.desc&&!$('#f_desc').value.trim())$('#f_desc').value=r.desc;z.innerHTML='';ms('Champs remplis. Relis et corrige si besoin, puis enregistre.')}};
draw(null,true);let r=null;try{r=await webInfo(v)}catch(x){}draw(r,false)},700)}}
function pmRender(){const n=$('#pm');if(!n||!ed)return;const L=imgs(ed);
n.innerHTML=(L.length>1?'<p class="m" style="width:100%">Utilise les flèches pour changer l\'ordre. La photo n°1 est celle qu\'on voit en premier.</p>':'')+L.map((u,i)=>'<div><span class="pk">'+(i+1)+'</span><img src="'+esc(u)+'" alt="Photo '+(i+1)+'"><div class="ar"><button type="button" class="btn alt" data-l="'+i+'" aria-label="Avancer la photo '+(i+1)+'"'+(i?'':' disabled')+'>&#9664;</button><button type="button" class="btn alt" data-r="'+i+'" aria-label="Reculer la photo '+(i+1)+'"'+(i<L.length-1?'':' disabled')+'>&#9654;</button></div><button type="button" class="btn alt" data-x="'+i+'">Retirer</button></div>').join('')+(L.length<3?'<p class="m" style="width:100%">Ajoute encore '+(3-L.length)+' photo(s) pour bien présenter la paire.</p>':'');
const mv=(i,j)=>{const a=imgs(ed);if(j<0||j>=a.length)return;a.splice(j,0,a.splice(i,1)[0]);ed.img=a.join(' ');pmRender()};
n.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>mv(+b.dataset.l,+b.dataset.l-1));
n.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>mv(+b.dataset.r,+b.dataset.r+1));
n.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const a=imgs(ed);a.splice(+b.dataset.x,1);ed.img=a.join(' ');pmRender()});
const fi=$('#f_img');if(fi)fi.onchange=async()=>{const fs=[...fi.files];if(!fs.length)return;const have=imgs(ed);if(have.length+fs.length>8){ms('8 photos maximum par paire.');fi.value='';return}let k=0;for(const f of fs){k++;ms('Envoi de la photo '+k+'/'+fs.length+'…');const b=await shrink(f);const path=Date.now()+'-'+k+'.jpg';const r=await sb.storage.from('pairs').upload(path,b,{contentType:'image/jpeg'});if(r.error){ms('Photo non envoyée : '+r.error.message);break}have.push(sb.storage.from('pairs').getPublicUrl(path).data.publicUrl);ed.img=have.join(' ');pmRender()}fi.value='';const t=$('#pn');if(t)t.textContent='';ms('Photos ajoutées. Change l\'ordre avec les flèches, puis Enregistre.')}}
function shrink(f){return new Promise(r=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>r(b||f),'image/jpeg',0.82)};i.onerror=()=>{URL.revokeObjectURL(u);r(f)};i.src=u})}
async function saveP(){const g=k=>$('#f_'+k).value.trim();if(!g('name')){ms('Mets au moins un nom.');return}const e=ed,fs=[...$('#f_img').files];
if(fs.length){const have=imgs(e);if(have.length+fs.length>8){ms('8 photos maximum par paire.');return}let k=0;for(const f of fs){k++;ms('Envoi de la photo '+k+'/'+fs.length+'…');const b=await shrink(f);const path=Date.now()+'-'+k+'.jpg';const r=await sb.storage.from('pairs').upload(path,b,{contentType:'image/jpeg'});if(r.error){ms('Photo non envoyée : '+r.error.message);return}have.push(sb.storage.from('pairs').getPublicUrl(path).data.publicUrl)}e.img=have.join(' ')}
['name','brand','year','pc','ps','rd','rc','sizes','colors','desc','status'].forEach(k=>e[k]=g(k));
const row={name:e.name,brand:e.brand,year:e.year,descr:e.desc,sizes:e.sizes,colors:e.colors,pc:e.pc,ps:e.ps,rd:e.rd,rc:e.rc,status:e.status,img:e.img||''};
ms('Enregistrement…');const r=e.id?await sb.from('products').update(row).eq('id',e.id):await sb.from('products').insert(row);
if(r.error){ms('Échec : '+r.error.message);return}await load();grid();ed=null;tab='p';adm();ms('Enregistré ✓')}
async function delP(id){const r=await sb.from('products').delete().eq('id',id);if(r.error){ms('Échec : '+r.error.message);return}await load();grid();ed=null;tab='p';adm()}
async function saveS(){['wa','ig','tk','fb','on','ou'].forEach(k=>{let v=$('#s_'+k).value.trim();if(k=='wa')v=v.replace(/\D/g,'');S.cfg[k]=v});
const r=await sb.from('settings').upsert({id:1,data:S.cfg});if(r.error){ms('Échec : '+r.error.message);return}
const p=$('#s_p').value;if(p){const u=await sb.auth.updateUser({password:p});if(u.error){ms('Mot de passe non changé : '+u.error.message);return}}
const ne=$('#s_u').value.trim();if(ne){const u=await sb.auth.updateUser({email:ne},{emailRedirectTo:location.origin+location.pathname});if(u.error){ms('Identifiant non changé : '+u.error.message);return}ms('Un e-mail de confirmation vient d’être envoyé.');return}
render();adm();ms('Enregistré ✓')}
try{const t=localStorage.getItem('rs-theme');if(t)document.documentElement.dataset.theme=t}catch(x){}
(async()=>{const ok=!CFG.url.startsWith('COLLE');S.loading=ok;try{const c=JSON.parse(localStorage.getItem('rs-cache')||'null');if(c){S.products=c.p;S.cfg={...DEF,...c.c};S.loading=false}}catch(x){}render();
try{if(ok){sb=supabase.createClient(CFG.url,CFG.key);sb.auth.onAuthStateChange((e,s)=>{own=!!s;if(e=='PASSWORD_RECOVERY'){recov()}else if($('#gr'))grid()});const s=await sb.auth.getSession();own=!!(s.data&&s.data.session);await load();S.loading=false;try{localStorage.setItem('rs-cache',JSON.stringify({p:S.products,c:S.cfg}))}catch(x){}if(own)loadMiss();
try{if(!sessionStorage.getItem('v')){sessionStorage.setItem('v','1');sb.from('visits').insert({}).then(()=>{})}}catch(x){}}}catch(x){}
render();if(!ok)$('#gr').innerHTML='<div class="none"><p>Configuration Supabase manquante dans index.html.</p></div>'})();
