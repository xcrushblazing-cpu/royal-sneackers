const EYE1='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE0=EYE1.replace('</svg>','<path d="M3 3l18 18"/></svg>');
function pwBox(id,ac){return '<div class="pw"><input id="'+id+'" type="password" autocomplete="'+ac+'"><button type="button" class="eye" aria-label="Afficher ou cacher le mot de passe">'+EYE1+'</button></div>'}
function eyes(m){m.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{const i=b.previousElementSibling,s=i.type=='password';i.type=s?'text':'password';b.innerHTML=s?EYE0:EYE1})}
async function forgot(){const e=$('#lu').value.trim();if(!e){ms('Écris ton e-mail dans Identifiant, puis appuie de nouveau.');return}ms('Envoi…');const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});ms(r.error?'Échec : '+r.error.message:'Si cet e-mail est le bon, un lien vient d’être envoyé.')}
function recov(){const m=box('<div class="li"><b>Nouveau mot de passe</b><button class="btn alt" id="x">Fermer</button></div><div class="f"><label>Nouveau mot de passe'+pwBox('np','new-password')+'</label><button class="btn g" id="np_ok">Enregistrer</button></div>');$('#x').onclick=()=>m.remove();eyes(m);$('#np_ok').onclick=async()=>{const p=$('#np').value;if(p.length<6){ms('6 caractères minimum.');return}const r=await sb.auth.updateUser({password:p});if(r.error){ms('Échec : '+r.error.message);return}ms('Mot de passe changé ✓');own=true;try{history.replaceState(null,'',location.pathname)}catch(x){}setTimeout(()=>{m.remove();render()},900)}}
function login(){const m=box('<div class="li"><b>Gérer ma boutique</b><button class="btn alt" id="x">Fermer</button></div><p class="note">Seul le Propriétaire est concerné.</p><div class="f"><label>Identifiant (e-mail)<input id="lu" type="email" autocomplete="username"></label><label>Mot de passe'+pwBox('lp','current-password')+'</label><button class="btn g" id="lg">Se connecter</button><button type="button" class="btn alt" id="fg">Mot de passe oublié ?</button></div>');
$('#x').onclick=()=>m.remove();
eyes(m);$('#fg').onclick=forgot;$('#lg').onclick=async()=>{const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||!p){ms('Remplis les deux champs.');return}ms('Connexion…');const r=await sb.auth.signInWithPassword({email:u,password:p});if(r.error){ms('Identifiant ou mot de passe incorrect.');return}own=true;await loadMiss();render();openAdm(null)}}
function openAdm(id){ed=id?JSON.parse(JSON.stringify(S.products.find(p=>p.id==id))):null;tab=ed?'e':'p';adm()}
function adm(){const c=S.cfg;let h='<div class="li"><b>Ma boutique ('+S.products.length+' paires)</b><span><button class="btn alt" id="lo">Déconnexion</button> <button class="btn alt" id="x">Fermer</button></span></div><div class="bar"><button data-t="p" class="'+(tab=='p'?'on':'')+'">Paires</button><button data-t="n" class="'+(tab=='n'||tab=='e'?'on':'')+'">'+(ed&&ed.id?'Modifier':'Ajouter')+'</button><button data-t="s" class="'+(tab=='s'?'on':'')+'">Réseaux</button><button data-t="d" class="'+(tab=='d'?'on':'')+'">Demandes'+(MISS.length?' ('+MISS.length+')':'')+'</button></div>';
if(tab=='p'){h+=S.products.map(p=>'<div class="li"><span>'+esc(p.name)+'</span><button class="btn alt" data-e2="'+p.id+'">Modifier</button></div>').join('')||'<p class="m">Aucune paire.</p>'}
else if(tab=='d'){h+=demHtml()}else if(tab=='s'){h+='<div class="f"><label>Numéro WhatsApp (indicatif sans +)<input id="s_wa" value="'+esc(c.wa)+'"></label><label>Instagram (sans @)<input id="s_ig" value="'+esc(c.ig)+'"></label><label>TikTok (sans @)<input id="s_tk" value="'+esc(c.tk)+'"></label><label>Lien Facebook complet<input id="s_fb" value="'+esc(c.fb)+'"></label><div class="r2"><label>Autre réseau (nom)<input id="s_on" value="'+esc(c.on)+'" placeholder="YouTube"></label><label>Son lien<input id="s_ou" value="'+esc(c.ou)+'"></label></div><label>Nouvel identifiant e-mail (optionnel)<input id="s_u" type="email"></label><label>Nouveau mot de passe (optionnel)'+pwBox('s_p','new-password')+'</label><button class="btn g" id="sv">Enregistrer et publier</button></div>'}
else{const e=ed||{id:'',name:'',brand:'',year:'',desc:'',sizes:'36 – 45',colors:'',pc:'',ps:'',rd:'-30%',rc:'100%',status:'dispo',img:''};ed=e;const v=k=>esc(e[k]);
h+='<div class="f"><label>Nom de la paire<input id="f_name" value="'+v('name')+'"></label><div class="r2"><label>Marque<input id="f_brand" value="'+v('brand')+'"></label><label>Année de sortie<input id="f_year" value="'+v('year')+'"></label></div><div class="r2"><label>Prix avec carton<input id="f_pc" value="'+v('pc')+'" placeholder="ex. 35 000 FCFA"></label><label>Prix sans carton<input id="f_ps" value="'+v('ps')+'"></label></div><label>Badge sans carton (ex. -30%, vide pour l’enlever)<input id="f_rd" value="'+v('rd')+'"></label><label>Badge avec carton (ex. 100%)<input id="f_rc" value="'+v('rc')+'"></label><label>Tailles<input id="f_sizes" value="'+v('sizes')+'"></label><label>Couleurs<input id="f_colors" value="'+v('colors')+'"></label><label>Description<textarea id="f_desc" rows="3">'+v('desc')+'</textarea></label><label>Statut<select id="f_status"><option value="dispo"'+(e.status=='dispo'?' selected':'')+'>Disponible</option><option value="commande"'+(e.status=='commande'?' selected':'')+'>Sur commande</option></select></label><label>Photo<input type="file" id="f_img" accept="image/*"></label>'+(e.img?'<img src="'+esc(e.img)+'" alt="" style="width:90px;border-radius:8px">':'')+'<button class="btn g" id="sv">Enregistrer et publier</button>'+(e.id?'<button class="btn alt" id="del">Supprimer cette paire</button>':'')+'</div>'}
const m=box(h);$('#x').onclick=()=>m.remove();eyes(m);
m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab=='n')ed=null;adm()});
m.querySelectorAll('[data-e2]').forEach(b=>b.onclick=()=>openAdm(b.dataset.e2));
const lo=$('#lo');if(lo)lo.onclick=async()=>{await sb.auth.signOut();own=false;MISS=[];render();m.remove()};
m.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ed=null;tab='n';adm();$('#f_name').value=MISS[b.dataset.add].term});
m.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{await sb.from('searches').update({done:true}).in('id',MISS[b.dataset.ok].ids);await loadMiss();adm()});
const sv=$('#sv');if(sv)sv.onclick=tab=='s'?saveS:saveP;
const d=$('#del');if(d)d.onclick=()=>{if(d.dataset.k){delP(ed.id)}else{d.dataset.k=1;d.textContent='Confirmer la suppression'}}}

async function saveP(){const g=k=>$('#f_'+k).value.trim();if(!g('name')){ms('Mets au moins un nom.');return}const e=ed,f=$('#f_img').files[0];
if(f){ms('Envoi de la photo…');const path=Date.now()+'-'+f.name.replace(/[^a-z0-9.]/gi,'_');const r=await sb.storage.from('pairs').upload(path,f);if(r.error){ms('Photo non envoyée : '+r.error.message);return}e.img=sb.storage.from('pairs').getPublicUrl(path).data.publicUrl}
['name','brand','year','pc','ps','rd','rc','sizes','colors','desc','status'].forEach(k=>e[k]=g(k));
const row={name:e.name,brand:e.brand,year:e.year,descr:e.desc,sizes:e.sizes,colors:e.colors,pc:e.pc,ps:e.ps,rd:e.rd,rc:e.rc,status:e.status,img:e.img||''};
ms('Enregistrement…');const r=e.id?await sb.from('products').update(row).eq('id',e.id):await sb.from('products').insert(row);
if(r.error){ms('Échec : '+r.error.message);return}await load();grid();ed=null;tab='p';adm();ms('Enregistré ✓')}
async function delP(id){const r=await sb.from('products').delete().eq('id',id);if(r.error){ms('Échec : '+r.error.message);return}await load();grid();ed=null;tab='p';adm()}
async function saveS(){['wa','ig','tk','fb','on','ou'].forEach(k=>{let v=$('#s_'+k).value.trim();if(k=='wa')v=v.replace(/\D/g,'');S.cfg[k]=v});
const r=await sb.from('settings').upsert({id:1,data:S.cfg});if(r.error){ms('Échec : '+r.error.message);return}
const p=$('#s_p').value;if(p){const u=await sb.auth.updateUser({password:p});if(u.error){ms('Mot de passe non changé : '+u.error.message);return}}
const ne=$('#s_u').value.trim();if(ne){const u=await sb.auth.updateUser({email:ne},{emailRedirectTo:location.origin+location.pathname});if(u.error){ms('Identifiant non changé : '+u.error.message);return}ms('Un e-mail de confirmation vient d’être envoyé.');return}
render();adm();ms('Enregistré ✓')}
try{const t=localStorage.getItem('rs-theme');if(t)document.documentElement.dataset.theme=t}catch(x){}
(async()=>{const ok=!CFG.url.startsWith('COLLE');S.loading=ok;try{const c=JSON.parse(localStorage.getItem('rs-cache')||'null');if(c){S.products=c.p;S.cfg={...DEF,...c.c};S.loading=false}}catch(x){}render();
try{if(ok){sb=supabase.createClient(CFG.url,CFG.key);sb.auth.onAuthStateChange((e,s)=>{own=!!s;if(e=='PASSWORD_RECOVERY'){recov()}else if($('#gr'))grid()});const s=await sb.auth.getSession();own=!!(s.data&&s.data.session);await load();S.loading=false;try{localStorage.setItem('rs-cache',JSON.stringify({p:S.products,c:S.cfg}))}catch(x){}if(own)loadMiss();
try{if(!sessionStorage.getItem('v')){sessionStorage.setItem('v','1');sb.from('visits').insert({}).then(()=>{})}}catch(x){}}}catch(x){}
render();if(!ok)$('#gr').innerHTML='<div class="none"><p>Configuration Supabase manquante dans index.html.</p></div>'})();

</script>
</body>
</html>
