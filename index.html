function colorsFor(name){const t=wn(name).split(/[^a-z0-9]+/).filter(Boolean);for(const [ps,c] of CL){if(ps.some(p=>p.every(x=>t.includes(x))))return c}return ''}
async function wiki(lang,q){const c=new AbortController(),tm=setTimeout(()=>c.abort(),8000);try{const r=await fetch('https://'+lang+'.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=4&prop=extracts&exintro=1&explaintext=1&exsentences=3&exlimit=4&format=json&origin=*',{signal:c.signal});const j=await r.json();return Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index)}finally{clearTimeout(tm)}}
function wokay(name,title){const t=wn(title).split(/[^a-z0-9]+/).filter(Boolean),n=wn(name).split(/[^a-z0-9]+/).filter(x=>x&&x!='x');if(!n.length)return false;const m=n.filter(x=>t.includes(x)).length;return n.length==1?m==1:m>=Math.max(2,Math.ceil(n.length*.6))}
function wyear(t){const m=String(t).match(/(?:cr[ée]{1,2}e?s?|lanc[ée]e?s?|sortie?s?|introduit[es]?|commercialis[ée]e?s?|apparu[es]?|released|launched|introduced|debuted)[^.]{0,70}?\b((?:19|20)\d\d)\b/i);return m?m[1]:''}
async function webInfo(name){if(typeof DEMO_ON!='undefined'){await new Promise(r=>setTimeout(r,700));return{title:name,lang:'fr',year:'2024',desc:'Exemple de démonstration : sur le vrai site, ce texte vient d\'une recherche sur Wikipédia. Tu peux le relire et le modifier avant d\'enregistrer.'}}
for(const [lang,qs] of [['fr',[name+' chaussure',name]],['en',[name+' sneaker',name]]]){for(const q of qs){let L;try{L=await wiki(lang,q)}catch(x){continue}const g=L.find(x=>x.extract&&wokay(name,x.title));if(g){const ex=g.extract.replace(/\s*\n+\s*/g,' ').trim();return{title:g.title,lang,year:wyear(ex),desc:ex.length>420?ex.slice(0,420).replace(/[^.!?]*$/,'').trim()||ex.slice(0,420):ex}}}}return null}

function shrink(f){return new Promise(r=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>r(b||f),'image/jpeg',0.82)};i.onerror=()=>{URL.revokeObjectURL(u);r(f)};i.src=u})}
